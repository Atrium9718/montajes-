<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Macula · imposición para imprenta</title>
  <meta name="description" content="Macula: montajes automáticos para imprenta: volantes, tarjetas, revistas, libros y portadas. Entrega el PDF listo para imprimir.">
  <link rel="icon" href="marca.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header class="barra">
    <a class="marca" href="#inicio" aria-label="Macula, inicio">
      <span class="marca-orbe" aria-hidden="true"></span>
      <span>macula</span>
    </a>
    <nav class="nav" aria-label="Secciones">
      <a href="#inicio" data-vista="inicio">Inicio</a>
      <a href="#piezas" data-vista="piezas">Piezas</a>
      <a href="#diagramar" data-vista="diagramar">Diagramar</a>
      <a href="#libro" data-vista="libro">Libros</a>
      <a href="#portada" data-vista="portada">Portadas</a>
      <a href="#catalogos" data-vista="catalogos">Catálogos</a>
    </nav>
    <a class="cuenta-boton" id="cuenta-boton" href="#cuenta" hidden><span></span></a>
  </header>
  <div class="franja-cuenta" id="franja-cuenta" hidden></div>

  <main id="vista" tabindex="-1">
    <div class="cargando"><span class="orbe orbe-respira"></span><p>Preparando el motor…</p></div>
  </main>

  <footer class="pie">
    <p>Tus archivos no salen de tu computador: el motor de imposición corre dentro del navegador.</p>
    <p class="pie-version" id="version"></p>
  </footer>

  <div class="aviso-flotante" id="aviso" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
