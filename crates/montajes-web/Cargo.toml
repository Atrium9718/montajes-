[package]
name = "montajes-web"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
js-sys = "0.3.106"
lopdf = { version = "0.45.0", default-features = false, features = ["wasm_js"] }
montajes-core = { version = "0.1.0", path = "../montajes-core" }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
wasm-bindgen = "0.2.129"

[lib]
crate-type = ["cdylib", "rlib"]
